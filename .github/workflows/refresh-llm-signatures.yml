name: Refresh AI-UA signatures

on:
  schedule:          # every night 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch: # manual “Run workflow” button

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest list from TypeScript
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let ts = fs.readFileSync('signatures/llm.ts', 'utf8');
          ts = ts
            .replace(/^\/\/.*\n/, '')
            .replace('export default ', '')
            .replace(/satisfies.*;/, '')
            .trim();
          const obj = eval('(' + ts + ')');
          const json = JSON.stringify(
            obj,
            (k, v) => (v instanceof RegExp ? v.source : v),
            2
          );
          fs.writeFileSync('signatures/llm.json', json + '\n');
          EOF

      - name: Commit & push if changed
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@users.noreply.github.com
          message: 'chore: nightly UA-signature refresh'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

